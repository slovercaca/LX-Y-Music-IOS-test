name: Build iOS IPA

on:
  push:
    branches:
      - master
      - ios-adaptation
    tags:
      - '*-v[0-9]*'
  workflow_dispatch:

# 同一分支有新 push 时，自动取消排队中/运行中的旧构建，避免连续 push 堆积过时构建浪费 macOS runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios-ipa:
    name: iOS IPA
    # Xcode 26（Swift 6.2）：液态玻璃的 iOS 26 原生 UIGlassEffect 路径依赖新 SDK 编译
    runs-on: macos-26
    env:
      NO_FLIPPER: 1
      IOS_SCHEME: LxMusicMobile
      IOS_WORKSPACE: ios/LxMusicMobile.xcworkspace
      IOS_BUNDLE_IDENTIFIER: com.LX-YMusic.shuhao
      DERIVED_DATA_PATH: build/DerivedData
      ARCHIVE_PATH: build/LxMusicMobile.xcarchive
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          gem install cocoapods -v '~> 1.15' --no-document
          cd ios
          # CocoaPods trunk CDN (jsdelivr) occasionally returns 400/404 for spec files; retry on failure
          for attempt in 1 2 3; do
            pod install --repo-update && break
            echo "pod install failed (attempt $attempt/3), retrying in 15s..."
            sleep 15
            if [ "$attempt" = "3" ]; then exit 1; fi
          done

      - name: Read package version (date-based)
        shell: bash
        run: |
          # 分钟精度：同日多次构建的 artifact 名可区分（定位「测的是哪个包」）
          PACKAGE_VERSION=$(date +%Y%m%d%H%M)
          PACKAGE_VERSION_CODE=$(date +%Y%m%d%H%M)
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION_CODE=$PACKAGE_VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        shell: bash
        env:
          SOURCEMAP_FILE: ${{ github.workspace }}/build/main.jsbundle.map
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -workspace "$IOS_WORKSPACE" \
            -scheme "$IOS_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_IDENTIFIER" \
            MARKETING_VERSION="$PACKAGE_VERSION" \
            CURRENT_PROJECT_VERSION="$PACKAGE_VERSION_CODE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build 2>&1 | tee build/xcodebuild.log

      - name: Upload source map artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourcemap
          path: build/main.jsbundle.map
          if-no-files-found: ignore

      - name: Show first Xcode errors
        if: failure()
        shell: bash
        run: |
          echo "===== Xcode errors ====="
          grep -n -C 3 "error:" build/xcodebuild.log | head -120 || true

      - name: Upload Xcode build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH="$(find "$DERIVED_DATA_PATH/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          (
            cd build
            zip -qry "$IPA_NAME" Payload
          )

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-LX-Y-Music-v${{ env.PACKAGE_VERSION }}-unsigned
          path: build/LX-Y Music-v${{ env.PACKAGE_VERSION }}-ios-unsigned.ipa

      - name: Publish unsigned IPA to rolling "latest" release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/ios-adaptation'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA_NAME="LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          NOTES="Automated unsigned IPA build from ${{ github.ref_name }} @ ${{ github.sha }}. Built on ${{ github.run_id }} — do not use as a stable release."
          # 用 gh CLI（原生二进制，不受 Node 24 运行时影响）更新 rolling "latest" release。
          # 原先 softprops/action-gh-release 在 Node 24 强制环境下上传大文件会报
          # "Request body length does not match content-length header"。
          gh release upload latest "build/${IPA_NAME}" --clobber \
            || gh release create latest "build/${IPA_NAME}" --title "Latest Unsigned Build" --prerelease --notes "$NOTES" || true

      - name: Release versioned IPA (codename)
        # 正式版发布：tag 格式为 <代号>-v<数字>（如 Ocean-v1）。
        # 产物改名为 LX-Y-Test.Music-<代号>-v<数字>.ipa，创建 draft Release
        # 并自动生成更新日志草稿；发布者在网页端编辑清楚更新内容后手动 Publish。
        if: startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          SRC_IPA="build/LX-Y Music-v${PACKAGE_VERSION}-ios-unsigned.ipa"
          IPA_NAME="LX-Y-Test.Music-${TAG_NAME}.ipa"
          mv "$SRC_IPA" "build/${IPA_NAME}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            # draft 已存在（网页端先建的 tag），直接把 IPA 传上去
            gh release upload "${TAG_NAME}" "build/${IPA_NAME}" --clobber || true
            echo "Uploaded '${IPA_NAME}' to existing draft release '${TAG_NAME}'.""
          else
            gh release create "${TAG_NAME}" "build/${IPA_NAME}" \
              --title "${TAG_NAME}" \
              --draft \
              --generate-notes || true
            echo "Draft release '${TAG_NAME}' created with '${IPA_NAME}'. Edit release notes, then publish manually.""
          fi
